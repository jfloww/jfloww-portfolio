<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal Finance Copilot</title>
  <desc id="desc">Three transaction sources flowing into one clear spending pattern.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#171b22" />
      <stop offset="1" stop-color="#08090b" />
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5aa1e9" stop-opacity="0.08" />
      <stop offset="0.7" stop-color="#08090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyan-mint" gradientUnits="userSpaceOnUse" x1="120" y1="280" x2="280" y2="120">
      <stop offset="0" stop-color="#4ade80" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#background)" />
  <circle cx="800" cy="450" r="400" fill="url(#glow)" />
  <circle cx="800" cy="450" r="277" fill="#0b0d11" stroke="#242a34" stroke-width="2" />

  <g transform="translate(586 236) scale(1.07)">
    <g fill="none" stroke="#ece9e3" stroke-width="12" stroke-linecap="round" opacity="0.9">
      <path d="M110 110 142 142" />
      <path d="M110 290 142 258" />
      <path d="M327 200H282" />
    </g>

    <g fill="#ece9e3" opacity="0.9">
      <circle cx="110" cy="110" r="12" />
      <circle cx="110" cy="290" r="12" />
      <circle cx="327" cy="200" r="12" />
    </g>

    <circle cx="200" cy="200" r="64" fill="none" stroke="url(#cyan-mint)" stroke-width="24" />
    <circle cx="200" cy="200" r="12" fill="#f8f5f0" />
  </g>
</svg>
